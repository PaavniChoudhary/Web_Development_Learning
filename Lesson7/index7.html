<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style7.css">
</head>
<body>
    <p><b>7a. Make the image a circle</b></p>
    <img class="img1" src="cat_image.jpg" alt="cat">
    <hr>
    <p><b>7b. Make the image a square and centre the image within it.</b></p>
    <img class="img2" src="cat_image.jpg" alt="cat">
    <hr>
    <p><b>7c. Searchbox with rounded corners</b></p>
    <input class="box" type="text" placeholder="Search">
    <hr>
    <p><b>7d. Searchbox with a shadow and no border</b></p>
    <input class="box2" type="text" placeholder="Search Google or type a URL">
    <hr>
    <p><b>7e. LinkedIn Signup</b></p>
    <p id="label" class="signup">Email</p>
    <input class="box3" type="text" placeholder="Enter your email">        
    <p id="disclaimer" class="signup">By clicking Agree & Join, you agree to the Privacy Policy.</p>
    <button class="join-button">  Agree & Join</button>
    <hr>
    <p><b>7f. Twitter text box</b></p>
    <img class="profile-picture" src="cat_image.jpg">
    <input type="text" class="text-box" placeholder="What's happening?">
    <button class="tweet-button">Tweet</button>
</body>
</html>
